Schema:
  Object Type: "Meta"
  Title: "Climate Information"
  Description: "Schema for describing climate information"
  Version: "0.2.0"
  Root Data Group: "ClimateInformation"
  Unit Systems:
    ClimateUnits:
      - h
      - degrees
      - ""
      - "%"
      - K-day
      - ppm
      - ppb
      - radians
      - ug/m3

SchemaType:
  Object Type: "Enumeration"
  Enumerators:
    CLIMATE_INFORMATION:
      Description: "Climate information"

# TODO: Add more enumerators for SUMMARY data source type, e.g., "measured", "modeled", "reanalysis", "assumption", etc. Rename this to TimeSeries Data Type.
TimeSeriesDataSourceType:
  Object Type: "Enumeration"
  Enumerators:
    DIRECT_MEASUREMENT:
      Description: "Direct Measurement"
      Display Text: "Direct Measurement"
    DERIVED_MEASUREMENT:
      Description: "Derived Measurement"
      Display Text: "Derived Measurement"
    MODELED:
      Description: "Modeled"
      Display Text: "Modeled"
    INTERPOLATED:
      Description: "Interpolated"
      Display Text: "Interpolated"
    ASSUMPTION:
      Description: "Assumption"
      Display Text: "Assumption"
    UNKNOWN:
      Description: "Unknown"
      Display Text: "Unknown"

TimeSeriesType:
  Object Type: "Enumeration"
  Enumerators:
    INSTANTANEOUS:
      Description: "Instantaneous"
      Notes: "Values reflect the instant of the current timestamp in the corresponding TimeInterval data group"
    AVERAGE:
      Description: "Average"
      Notes: "Values reflect the average between the previous timestamp and the current timestamp in the corresponding TimeInterval data group"
    SUM:
      Description: "Sum"
      Notes: "Values reflect the integrated sum between the previous timestamp and the current timestamp in the corresponding TimeInterval data group"
    CUMULATIVE:
      Description: "Cumulative"
      Notes: "Values reflect the cumulative sum between the starting timestamp and the current timestamp in the corresponding TimeInterval data group"

SummaryDataSourceType:
  Object Type: "Enumeration"
  Enumerators:
    MEASURED:
      Description: "Data measured from weather stations or other observational sources near the surface of the Earth. This would normally not include satellite data."
      Display Text: "Measured"
    MODELED:
      Description: "Modeled climate data from a numerical model of the global climate system, or its components, that provide estimates of weather data. These could be future projections, historical reconstructions, or other types of estimates."
      Display Text: "Modeled"

TimeSeriesClimateDataType:
  Object Type: "Enumeration"
  Enumerators:
    MEASURED:
      Description: "Measured climate data"
    TYPICAL:
      Description: "Typical climate data composed of either measured or modeled data, or both"
    REANALYSIS:
      Description: "Climate data from atmospheric reanalysis models used to provide weather and climatic data for historical periods worldwide"
    FORECAST:
      Description: "Climate data from numerical weather forecast models used to provide short term forecasts of weather conditions"
    PROJECTED:
      Description: "Projected climate data from a numerical model of the global climate system that provide estimates of future weather data driven by meteorological and human factors"

ClimateInformation:
  Object Type: "Data Group"
  Data Elements:
    metadata:
      Description: "Metadata"
      Type: "Group(Metadata)"
      Constraints: schema_name="CLIMATE_INFORMATION"
      Required: True
      Notes: "The Metadata data group is defined by ASHRAE Standard 232 and is intentionally not redefined in this schema."
    location:
      Description: "Location data group"
      Type: "Group(Location)"
      Required: True
    time_series_data_sets:
      Description: "An array of time series climate data sets for this location"
      Type: "Array(Group(TimeSeriesDataSet))"
      Constraints:
      - "[1..]"
    summary_data_sets:
      Description: "An array of summary climate data sets for this location"
      Type: "Array(Group(SummaryDataSet))"
      Constraints:
      - "[1..]"

ClimateZone:
  Object Type: "Data Group"
  Data Elements:
    system:
      Type: String
      Description: "Climate zone classification system"
      Required: True
    system_version:
      Type: String
      Description: "Version of the climate zone classification system"
      Required: True
    source_data_set:
      Type: String
      Description: "Informative notes on the data set used to determine climate zone"
    zone:
      Type: String
      Description: "Climate zone within the classification system"
      Required: True
    notes: 
      Type: String
      Description: "Informative notes about the climate zone classification"
    

Location:
  Object Type: "Data Group"
  Unit System: ClimateUnits
  Data Elements:
    name:
      Type: String
      Description: "Descriptive name of the weather station location"
      Notes: "Suggest including human-readable identifiers of location, e.g., country, state"
      Required: True
    country_code:
      Type: String
      Description: "Country"
      Notes: "ISO Alpha-3 country code"
      Required: True
    subdivision:
      Type: String
      Description: "Administrative subdivision within a country"
      Notes: "State, province, or other identified region"
    postal_code:
      Type: String
      Description: "Postal code"
    wmo_station_id:
      Type: String
      Description: "World Meteorological Organization Station Number"
      Notes: "World Meteorological Organization Station Number"
    wmo_station_class:
      Type: Integer
      # TODO: Confirm enumeration of WMO station classes, and whether this should be an enumeration or integer.
      Constraints: ">=1, <=5"
      Description: "World Meteorological Organization Station Class"
      Notes: "World Meteorological Organization Station Class, 1-3 for surface stations, 4 for upper air stations, 5 for ship-based stations, 6 for buoy-based stations, 7 for other platforms."
    wmo_region:
      Type: Integer
      Constraints: ">=1, <=6"
      Description: "World Meteorological Organization Regional Association area"
      Notes: "1=Africa, 2=Asia, 3=South America, 4=North/Central America and the Caribbean, 5=South-West Pacific, 6=Europe. Corresponds to the ASHRAE Handbook - Fundamentals 'Region' column."
    wigos_station_id:
    # TODO: Add patterns for WIGOS, WBAN, IATA, and ICAO station identifiers. For WIGOS, see https://oscar.wmo.int/surface/index.html. For WBAN, see https://www.ncei.noaa.gov/data/global-hourly/doc/wban-station-ids.pdf. For IATA, see https://en.wikipedia.org/wiki/List_of_airports_by_IATA_code:_A. For ICAO, see https://en.wikipedia.org/wiki/List_of_airports_by_ICAO_code:_A.
      Type: String
      Description: "WIGOS Station Identifier"
      Notes: "WMO Integrated Global Observing System, [https://oscar.wmo.int/surface/index.html](https://oscar.wmo.int/surface/index.html)"
    wban_station_id:
      Type: String
      Description: "Weather Bureau Army Navy Identifier"
    iata_station_id:
      Type: String
      Description: "International Air Transport Association Station Identifier"
    icao_station_id:
      Type: String
      Description: "International Civil Aviation Organization Station Identifier"
    maslib_catalog_number: # TODO: Confirm name with Sagar
      Type: String
      Description: "Master Station Library Catalog Number"
    latitude:
      Constraints: ">=-90.0, <=90.0"
      Type: Numeric
      Description: "Latitude relative to the equator"
      Notes: "+ is North, - is South"
      Required: True
      Units: "degrees"
    longitude:
      Constraints: ">=-180.0, <=180.0"
      Type: Numeric
      Description: "Longitude relative to prime meridian"
      Notes: "+ is East, - is West"
      Required: True
      Units: "degrees"
    time_zone_offset:
      Constraints: ">=-12.0, <=14.0"
      Type: Numeric
      Description: "Time zone offset relative to UTC at time of dataset creation"
      Required: True
      Units: "h"
    iana_time_zone_code:
      Type: String # TODO: Make this an enumeration of valid IANA time zone codes, not free-form string. https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      Description: "IANA time zone code"
      Required: True
    elevation:
      Type: Numeric
      Description: "Station elevation relative to sea level (bottom of station). To calculate the US standard pressure see Chapter 1 of ASHRAE Handbook - Fundamentals 2025."
      Required: True
      Units: "m"
    anemometer_height:
      Constraints: ">0.0"
      Type: Numeric
      Description: "Height of anemometer above the ground"
      Notes: "Typically 10 m (potentially move to Time Series Source for Wind Speed/Direction)"
      Required: True
      Units: "m"
    station_height:
      Constraints: ">0.0"
      Type: Numeric
      Description: "Height of other meteorological measurements above the ground"
      Notes: "Typically 1.8 m"
      Required: True
      Units: "m"
    notes:
      Type: String
      Description: "Notes"
    climate_zones:
      Type: "Array(Group(ClimateZone))"
      Description: "Climate zones for this location"
      Notes: "Climate zone object refers to list of climate zone classifications that are applicable to this location _only_, not necessarily applicable to a \"nearby\" site"
    quality_flags:
      Type: "Array(String)"
      Description: "Quality flags for this location"
      Notes: ["User-defined quality flags for this location", "Not intended to be a comprehensive list of all quality flags that may be relevant to this location, but rather a user-defined list of important quality flags that may be referenced in the TimeSeries data groups within the TimeSeriesDataSet data group(s)"]

SourceDataPeriod:
  Object Type: "Data Group"
  Data Elements:
    id:
      ID: True
      Type: String
      Description: Reference id
      Required: True
    start_time:
      Type: Timestamp
      Description: Starting time of source data period
      Required: True
    end_time:
      Type: Timestamp
      Description: Ending time of source data period
      Required: True
    notes:
      Type: String
      Description: Notes about this source data period
    ashrae_grade:
      Type: String
      Constraints: '["A", "B", "C", "D", "E"]'
      Description: ASHRAE grade of source data period based on ASHRAE Handbook - Fundamentals 2025 criteria for grade A-E

SummaryDataSet:
  Object Type: "Data Group"
  Data Elements:
    source_data_periods:
      Type: "Array(Group(SourceDataPeriod))"
      Description: Array of SourceDataPeriod data groups describing the time periods of the source data used to create this summary dataset
      Required: True
    summary_data:
      Type: "Group(ClimateSummaryData)"
      Description: Data group containing named summary data elements
      Required: True
    notes:
      Type: String
      Description: Supplementary information about this dataset
    

TimeSeriesDataSet:
  Object Type: Data Group
  Data Elements:
    time_intervals:
      Type: "Array(Group(TimeInterval))"
      Description: Array of TimeInterval data groups whose ids may be referenced within TimeSeries data groups
      Required: True
    time_series:
      Type: "Group(ClimateTimeSeries)"
      Description: Data group containing named TimeSeries data elements
      Required: True
    notes:
      Type: String
      Description: Supplementary information about this dataset

TimeInterval:
  Object Type: "Data Group"
  Data Elements:
    id:
      ID: True
      Type: String
      Description: Reference id
      Required: True
    starting_time:
      Description: Beginning of data
      Type: Timestamp
      Required: False
      Notes: Used to determine the "previous" timestamp for the first value in a time
        series where the time series is not instantaneous
    regular_interval:
      Description: Duration of regular intervals
      Type: Numeric
      Units: s
      Constraints: ">0"
      Required: if !timestamps
    timestamps:
      Description: Array of timestamps
      Type: "Array(Timestamp)"
      Constraints: "[1..]"
      Required: if !regular_interval
    labels:
      Description: Informal labels describing each time interval
      Type: "Array(String)"
      Constraints: "[1..]"
      Notes: e.g., Month names for monthly intervals
    notes:
      Description: Notes about each time interval
      Type: "Array(String)"
      Constraints: "[1..]"

ClimateSummaryData:
  Object Type: "Data Group"
  Data Elements:
    dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature"
      - units="K"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Dry-bulb temperature
    dew_point_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dew-point temperature"
      - units="K"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Dew-point temperature
    relative_humidity:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Relative humidity"
      - units="-"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '-'
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: '-'
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>=0, <=1'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Relative humidity
    dry_bulb_temperature_coincident_mean_wet_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with mean wet-bulb temperature"
      - units="K"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      # NOTE: base/index variable (values) is dry-bulb temperature (K); the coincident
      # variable (coincident_values) is wet-bulb temperature (K). Inferred from this
      # element's own name/description — please review.
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Dry-bulb temperature coincident with mean wet-bulb temperature
    dry_bulb_temperature_coincident_mean_wind_speed:
      Type: Group(SummaryData)
      Constraints:
      - display_name="MCWS/DB"
      - units="m/s"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      # NOTE: units corrected from K to m/s to match the stored quantity (mean wind speed),
      # not the dry-bulb temperature it's coincident with. Base/index variable (values) is
      # dry-bulb temperature (K); the coincident variable (coincident_values) is wind speed
      # (m/s). Inferred from this element's own name/description — please review.
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: m/s
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: m/s
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Mean wind speed coincident with given dry-bulb temperature statistic
    daily_average_dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Daily average dry-bulb temperature"
      - units="K"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Daily average dry-bulb temperature
      Notes: This is the sum of the daily minimum and maximum temperatures divided by 2. Generally used to estimate monthly degree days.
    liquid_precipitation_depth:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Liquid precipitation depth"
      - units="m"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: m
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: m
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Liquid precipitation depth
      Notes: The cumulative depth of precipitation in the past time step.
    heating_degree_days:
      Type: Array(Group(DegreeDays))
      Description: Heating degree days
      Notes: Array of heating degree days defined by a base temperature. The cumulative number of degrees that a day's average temperature is below a base temperature, typically used for estimating heating energy requirements.
    cooling_degree_days:
      Type: Array(Group(DegreeDays))
      Description: Cooling degree days
      Notes: Array of cooling degree days defined by a base temperature. The cumulative number of degrees that a day's average temperature is above a base temperature, typically used for estimating cooling energy requirements.
    wet_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Wet-bulb temperature"
      - units="K"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Wet-bulb temperature
      Notes: "Covers the ASHRAE annual and monthly design wet-bulb conditions (Evaporation WB), the extreme maximum wet-bulb (annual.maximum), and the extreme annual mean/standard deviation of the minimum/maximum wet-bulb."
    wind_speed:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Wind speed"
      - units="m/s"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: m/s
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: m/s
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Wind speed
      Notes: "Wind speed at the anemometer height (typically 10 m). Covers the ASHRAE average annual/monthly wind speed (mean) and the extreme annual wind speed (percent_exceedance at 1/2.5/5%)."
    enthalpy:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Enthalpy"
      - units="J/kg"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: J/kg
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: J/kg
      Description: Moist-air specific enthalpy
      Notes: "Derivable from dry-bulb temperature, humidity, and station pressure; included for convenience to support the ASHRAE annual enthalpy design conditions (percent_exceedance at 0.4/1/2%)."
    dew_point_temperature_coincident_mean_dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with dew-point temperature"
      - units="K"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Mean dry-bulb temperature coincident with a given dew-point temperature statistic
      Notes: "ASHRAE humidification (99.0/99.6%) and dehumidification (0.4/1/2%) MCDB. The percent_time_exceeded grid refers to the percentile of the dew-point temperature."
    wet_bulb_temperature_coincident_mean_dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with wet-bulb temperature"
      - units="K"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Mean dry-bulb temperature coincident with a given wet-bulb temperature statistic
      Notes: "ASHRAE evaporation (Evaporation WB/MCDB) and monthly design wet-bulb MCDB. The percent_time_exceeded grid refers to the percentile of the wet-bulb temperature."
    dry_bulb_temperature_coincident_prevailing_wind_direction:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Prevailing wind direction coincident with dry-bulb temperature"
      - units="radians"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      # NOTE: units corrected on the percent_exceedance basis (values) from radians to K to
      # match the basis/index variable (dry-bulb temperature), per Notes below. The stored
      # quantity itself (prevailing wind direction, radians) is unchanged. Please review.
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: radians
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: radians
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>=0, <=6.283185307179586'
      Description: Prevailing (most frequent) wind direction coincident with a given dry-bulb temperature statistic
      Notes: "ASHRAE PCWD to the 99.6% (heating) and 0.4% (cooling) design dry-bulb temperatures. Clockwise from north."
    enthalpy_coincident_mean_dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with enthalpy"
      - units="K"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      # NOTE: units corrected on the percent_exceedance basis (values) from K to J/kg to match
      # the basis/index variable (enthalpy), per Notes below. The stored quantity itself
      # (dry-bulb temperature, K) is unchanged. Please review.
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: J/kg
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Mean dry-bulb temperature coincident with a given enthalpy statistic
      Notes: "ASHRAE enthalpy MCDB at the 0.4/1/2% annual enthalpy design conditions."
    wind_speed_coincident_mean_dry_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Dry-bulb temperature coincident with wind speed"
      - units="K"
      - (annual|monthly).statistic_type=COINCIDENT_VALUES
      # NOTE: units corrected on the percent_exceedance basis (values) from K to m/s to match
      # the basis/index variable (wind speed), per Notes below. The stored quantity itself
      # (dry-bulb temperature, K) is unchanged. Please review.
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: m/s
        - path: (annual|monthly).percent_exceedance.lookup_variables.coincident_values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|maximum|minimum)
          value: '>0'
        - path: (annual|monthly).(standard_deviation|standard_deviation_minimum|standard_deviation_maximum)
          value: '>=0'
      Description: Mean dry-bulb temperature coincident with a given wind-speed statistic
      Notes: "ASHRAE coldest-month wind speed MCDB at the 0.4/1% design wind speeds."
    clear_sky_beam_optical_depth:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Clear-sky beam (pseudo-)optical depth"
      - units="-"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '-'
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: '-'
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Clear-sky beam pseudo-optical depth (taub)
      Notes: "Monthly ASHRAE clear-sky beam optical depth (taub) for the 21st day of each month, used with the ASHRAE clear-sky solar model (Chapter 14). The clear-sky noon beam/diffuse irradiances derived from taub/taud are intentionally excluded (derivable)."
    clear_sky_diffuse_optical_depth:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Clear-sky diffuse (pseudo-)optical depth"
      - units="-"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '-'
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: '-'
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Clear-sky diffuse pseudo-optical depth (taud)
      Notes: "Monthly ASHRAE clear-sky diffuse optical depth (taud) for the 21st day of each month."
    daily_all_sky_solar_irradiation:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Daily all-sky global horizontal solar irradiation"
      - units="J/m2"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: J/m2
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: J/m2
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Average daily all-sky global horizontal solar irradiation
      Notes: "ASHRAE all-sky average monthly global horizontal radiation (mean) and its standard deviation, expressed as energy per unit area per day."
    daily_dry_bulb_temperature_range:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Mean daily dry-bulb temperature range"
      - units="K"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Mean daily dry-bulb temperature range
      Notes: "ASHRAE mean daily dry-bulb temperature range by month. This is a temperature difference, so its numeric value is identical in kelvin and degrees Celsius. The Hottest Month DB Range equals this variable in the hottest month and is therefore not stored separately."
    daily_dry_bulb_temperature_range_at_design_dry_bulb_temperature:
