      Description: Mean daily dry-bulb temperature range coincident with the 5% monthly design wet-bulb temperature
      Notes: "ASHRAE mean daily dry-bulb range coincident with the 5% design wet-bulb temperature, by month."
    daily_wet_bulb_temperature_range_at_design_wet_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
      - display_name="Mean daily wet-bulb temperature range at the design wet-bulb temperature"
      - units="K"
      - (annual|monthly).statistic_type=SINGLE_VALUE
      Nested Attribute Overrides:
        Units:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
