      Description: Mean daily wet-bulb temperature range coincident with the 5% monthly design wet-bulb temperature
      Notes: "ASHRAE mean daily wet-bulb range coincident with the 5% design wet-bulb temperature, by month."
    coldest_month:
      Type: Integer
      Constraints: ">=1, <=12"
      Description: Index (1-12) of the coldest month (lowest mean daily dry-bulb temperature)
      Notes: "Convenience index derived from the monthly mean dry-bulb temperatures (1=January). Included for parity with the ASHRAE design data; trivially derivable. Unlike the other elements of this group it is a plain integer rather than a SummaryData group."
    hottest_month:
      Type: Integer
      Constraints: ">=1, <=12"
      Description: Index (1-12) of the hottest month (highest mean daily dry-bulb temperature)
      Notes: "Convenience index derived from the monthly mean dry-bulb temperatures (1=January). Included for parity with the ASHRAE design data; trivially derivable. Unlike the other elements of this group it is a plain integer rather than a SummaryData group."

ClimateTimeSeries:
