          value: K
        - path: (annual|monthly).percent_exceedance.lookup_variables.values
          value: K
        Constraints:
        - path: (annual|monthly).(mean|mean_minimum|mean_maximum|standard_deviation|standard_deviation_minimum|standard_deviation_maximum|maximum|minimum)
          value: '>=0'
      Description: Mean daily wet-bulb temperature range coincident with the 5% monthly design dry-bulb temperature
      Notes: "ASHRAE mean daily wet-bulb range coincident with the 5% design dry-bulb temperature, by month."
    daily_dry_bulb_temperature_range_at_design_wet_bulb_temperature:
      Type: Group(SummaryData)
      Constraints:
