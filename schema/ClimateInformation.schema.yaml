SummaryData:
  # TODO: Should this continued to be called "SummaryData" or something like "elements", "parameters", or "variables"?
  Object Type: "Data Group"
  Data Elements:
    display_name:
      Type: String
      Description: ""
      Required: true
    units:
      Type: String
      Description: ""
      Required: true
    source_data_period:
      Description: "Reference to the source data period defined in the parent summary data set"
      Type: "Reference(Group(SourceDataPeriod))"
      Required: true
    source_data_type:
      Type: Enumeration(SummaryDataSourceType)
      Description: "The type of source data for this summary data element"
      Required: true
    annual: 
      Type: "Group(Statistics)"
      Description: "Annual summary data element"
    monthly: 
      Type: "Array(Group(Statistics))"
      Constraints: "[12]"
      Description: "Monthly summary data element"
    notes:
      Type: String
      Description: "Notes about this summary data element"


Statistics:
  Object Type: "Data Group"
  Data Elements:
    statistic_type:
      Type: Enumeration(StatisticType)
      Description: "Whether percent_exceedance (if provided) reports a single value's own distribution, or that value coincident with a second variable's"
      Required: if percent_exceedance
    mean:
      Type: Numeric
      Description: "Arithmetic mean of the data"
    standard_deviation:
      Type: Numeric
      Description: "Standard deviation of the data"
    mean_minimum:
      Type: Numeric
      Description: "Mean of the minimum values for each year in the source data period"
    mean_maximum:
      Type: Numeric
      Description: "Mean of the maximum values for each year in the source data period"
    standard_deviation_minimum:
      Type: Numeric
      Description: "Standard deviation of the minimum values for each year in the source data period"
    standard_deviation_maximum:
      Type: Numeric
      Description: "Standard deviation of the maximum values for each year in the source data period"
    maximum:
      Type: Numeric
      Description: "Maximum (single highest) value observed during the source data period"
      Notes: "e.g., the ASHRAE Extreme Maximum Wet-Bulb temperature, or the maximum monthly/annual precipitation total"
    minimum:
      Type: Numeric
      Description: "Minimum (single lowest) value observed during the source data period"
      Notes: "e.g., the minimum monthly/annual precipitation total"
    percent_exceedance:
      Type: "Alternative(Group(PercentTimeExceedance), Group(PercentTimeExceedanceCoincident))"
      Constraints: statistic_type(SINGLE_VALUE, COINCIDENT_VALUES)
      Description: "Array of percent time exceedance values for this summary data element"

StatisticType:
  Object Type: "Enumeration"
  Enumerators:
    SINGLE_VALUE:
      Description: "Single value exceeding a certain threshold during the source data period. Derived from the distribution of the value in the source data."
    COINCIDENT_VALUES:
      Description: "Values coincident with another variable exceeding a certain threshold. Derived from the joint distribution of a variable and another variable in the source data."

PercentTimeExceedanceGridVariables:
  Object Type: "Data Group"
  Data Elements:
    percent_time_exceeded:
      Type: Array(Numeric)
      Description: "Percent of time that the value exceeded a certain threshold during the source data period"
      Constraints: ">=0, <=100"
      Units: "%"

PercentTimeExceedanceLookupVariables:
  Object Type: "Data Group"
  Data Elements:
    values:
      Type: Array(Numeric)
      Description: "Threshold values for percent time exceedance"

PercentTimeExceedanceCoincidentLookupVariables:
  Object Type: "Data Group"
  Data Elements:
    values:
      Type: Array(Numeric)
      Description: "Base-variable value at each percent_time_exceeded grid point (the variable whose percentile the grid describes)"
      Notes: "Unit is that of the base variable named in the coincident summary variable (e.g., dry-bulb temperature in K); it is not restated here."
    coincident_values:
      Type: Array(Numeric)
      Description: "Mean coincident value of the second variable at the same percent_time_exceeded grid point"
      Notes: "Unit is that of the coincident variable named in the coincident summary variable (e.g., mean wet-bulb temperature in K, or mean dry-bulb temperature coincident with enthalpy in K); it is not restated here. Both arrays draw their units from the model's SI-base definition of each named quantity."

PercentTimeExceedance:
  Object Type: "Data Group"
  Data Elements:
    grid_variables:
      Type: Group(PercentTimeExceedanceGridVariables)
      Description: "Percent of time that the value exceeded a certain threshold during the source data period"
    lookup_variables:
      Type: Group(PercentTimeExceedanceLookupVariables)
      Description: "Threshold values for percent time exceedance"

PercentTimeExceedanceCoincident:
  Object Type: "Data Group"
  Data Elements:
    grid_variables:
      Type: Group(PercentTimeExceedanceGridVariables)
      Description: "Percent of time that the value exceeded a certain threshold during the source data period, coincident with another variable exceeding a certain threshold"
    lookup_variables:
      Type: Group(PercentTimeExceedanceCoincidentLookupVariables)
      Description: "Threshold values for percent time exceedance coincident with another variable exceeding a certain threshold"

DegreeDays:
  Object Type: "Data Group"
  Data Elements:
    base_temperature:
      Type: Numeric
      Description: "Base temperature for degree day calculation"
      Units: "K"
      Constraints: ">0"
    annual:
      Type: Numeric
      Description: "Degree days calculated as the sum of the differences between the daily average temperature (min+max / 2) and the base temperature for each day in the source data period where the daily average temperature exceeds the base temperature"
      Units: "K-day"
    monthly:
      Type: "Array(Numeric)"
      Description: "Degree days calculated as the sum of the differences between the daily average temperature (min+max / 2) and the base temperature for each day in each month of the source data period where the daily average temperature exceeds the base temperature"
      Constraints: "[12]"
      Units: "K-day"

TimeSeries:
  Object Type: Data Group
  Data Elements:
    display_name:
      Type: String
      Description: ""
      Required: true
    units:
      Type: String
      Description: ""
      Required: true
    value_type:
      Type: Enumeration(TimeSeriesType)
      Description: ""
      Required: true
    value_time_intervals:
      Description: ""
      Type: "Reference(Group(TimeInterval))"
      Required: true
    values:
      Type: "Array(Numeric)"
      Constraints: "[1..]"
      Description: ""
      Required: true
    source_time_intervals:
      Description: ""
      Type: "Reference(Group(TimeInterval))"
      Required: false
    source:
      Type: "Array(Enumeration(TimeSeriesDataSourceType))"
      Constraints: "[1..]"
      Description: ""
      Required: false
    uncertainty_time_intervals:
      Description: ""
      Type: "Reference(Group(TimeInterval))"
      Required: false
    uncertainty:
      Type: "Array(Numeric)"
      Constraints: "[1..]"
      Description: ""
      Required: false
    notes_time_intervals:
      Description: ""
      Type: "Reference(Group(TimeInterval))"
      Required: false
    notes:
      Type: "Array(String)"
      Constraints: "[1..]"
      Description: ""
      Required: false
